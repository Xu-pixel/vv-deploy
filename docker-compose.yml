name: vv-productive

services:
  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts"]
    user: "${VV_UID:-1000}:${VV_GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./db:/app/db
    environment:
      VV_ROOT: /app
    restart: "no"

  app:
    build: .
    user: "${VV_UID:-1000}:${VV_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3009:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPOS_DIR}:${REPOS_DIR}
      - ./data:/app/data
      - ./secrets:/app/secrets
    environment:
      VV_ROOT: /app
      REPOS_DIR: ${REPOS_DIR:?set REPOS_DIR to the host repos directory}
      TRAEFIK_NETWORK: ${TRAEFIK_NETWORK:-traefik}
      VV_HOST: ${VV_HOST:-}
    restart: unless-stopped
